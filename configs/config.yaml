model:
  text2midi_model:
    decoder_max_sequence_length: 2048
    decoder_num_layers: 12
    decoder_num_heads: 8
    decoder_d_model: 768
    decoder_intermediate_size: 3072
    num_experts: 4
    # use_deepspeed: False # Unused in new trainer
    # use_accelerate: True # Unused in new trainer (Accelerator is always used)
    use_instrument_conditioning: True # Set True for instrument-controlled phase
    instrument_vocab_size: 23
    no_instr_token_id: 22
    dropout: 0.2 # Increased to 0.2 to stronger combat overfitting
    instrument_classes:
      [
        "Drums",
        "Piano",
        "Mallets",
        "Organs / Keyboards",
        "Guitars",
        "Basses",
        "Solo Strings",
        "String Articulations",
        "Harp",
        "Timpani",
        "String Ensembles",
        "Choirs / Voice Pads",
        "Orchestra Hit",
        "Brass",
        "Saxophones",
        "Double Reeds",
        "Clarinets",
        "Flutes & Pipes",
        "Synth Leads",
        "Synth Pads",
        "Synth FX",
        "World Instruments",
        "Percussive Instruments",
        "Sound Effects",
      ]

training:
    # Dataloader & Optimization defaults
  num_workers: 16
  shuffle: true
  use_augmentation: true # Enable caption augmentation (dropout) and MIDI pitch shift (-5 to +6 semitones)
  use_cache: true
  prefetch_factor: 8
  use_torch_compile: false # Disabled: incompatible with custom gating mechanism
  use_fused_adamw: true
  max_grad_norm: 1.0
  text2midi_model:
    # epochs: 100 # fallback

    # batch_size: 2 # Unused, shadowed by per_device_train_batch_size
    learning_rate: 0.0001 # learning rate for pretraining
    weight_decay: 0.1 # Increased to 0.1 for better regularization
    per_device_train_batch_size: 24
    gradient_accumulation_steps: 5
    validation_samples: null # Limit validation samples
    # Progressive instrument dropout: start high, gradually reduce
    # This forces the model to learn general patterns first, then specialize
    instrument_dropout_schedule:
      - [0, 0.5]
    strategies:
      pretrain:
        epochs_no_inst: 0
        epochs_inst: 40
      finetune:
        epochs_no_inst: 0
        epochs_inst: 30
    with_tracking: True # Enable TensorBoard logging
    checkpointing_steps: epoch
    report_to: tensorboard
    output_dir: ./checkpoints # Changed to relative path
    use_scheduler: True
    lr_scheduler_type: cosine #choices=["linear", "cosine", "cosine_with_restarts", "polynomial", "constant", "constant_with_warmup"]
    num_warmup_steps: 300
    min_lr_ratio: 0.0001
    save_every: 1
    max_train_steps: None
    # scheduled_sampling: False # Unused
    # epsilon: 0 # Unused
    # c: -0.0161 # Unused
    # k: -0.312 # Unused
    # Checkpoint strategy
    checkpoint_strategy:
      keep_best: true # Always keep best model
      keep_latest: true # Always keep latest checkpoint
      keep_last_n: 10 # Keep last N periodic checkpoints
      save_every: 1 # Save checkpoint every N epochs
      use_validation: true
      save_metadata: true # Save metadata with each checkpoint
      cleanup_old: true # Automatically remove old checkpoints

raw_data:
  caption_dataset_path: ./captions/all_captions.json # Unified MidiCaps + SymphonyNet
  raw_data_folders:
    lmd:
      folder_path: ./data/lakhmidi # Changed to relative path (optional, only if you have this data)
      file_extension: midi
    symphonynet:
      folder_path: ./data/symphonynet # Changed to relative path
      file_extension: mid
    maestro:
      folder_path: ./data/maestro-v3.0.0 # Changed to relative path
      file_extension: midi
    pop909:
      folder_path: ./data/POP909 # Changed to relative path
      file_extension: mid
    pijama:
      folder_path: ./data/PiJAMA # Changed to relative path
      file_extension: midi
    midicaps:
      folder_path: ./data/midicaps # Changed to relative path
      file_extension: mid

# deepspeed_config:
#   deepspeed_config_path: ./configs/ds_config.json # Changed to relative path

artifact_folder: ./artifacts
tokenizer_file: vocab_remi_z.pkl # file name saved/loaded under artifact_folder
predicted_midi_path_eval: evaluation_midi_json # Default output directory for evaluation
soundfont_path: soundfont # Directory containing soundfont files

tokenizer:
  pitch_range: [0, 127]
  beat_res:
    "0,1": 12
    "1,2": 4
    "2,4": 2
    "4,8": 1
  num_velocities: 32
  special_tokens: ["PAD", "BOS", "EOS", "MASK"]
  use_chords: false
  use_rests: false
  use_tempos: true
  use_time_signatures: true
  use_programs: true
  num_tempos: 32
  tempo_range: [40, 250]

inference:
  max_len: 2048
  temperature: 0.8
  multitrack_bias: 0
  use_kv_cache: true
  bar_bias: 0

evaluation:
  captions_file: captions/all_captions.json
  output_dir: evaluation_mid_no_inst_cond_smoothing_pretrain_14_finetune_7_no_mask
  remi_vocab: artifacts/vocab_remi_z.pkl
  device: cuda
  overwrite: false
  limit: 120
  split: test
  seed: 42
  batch_size: 24
  disable_instrument_masking: True
  disable_instrument_conditioning: True
  disable_grammar_constraints: false
