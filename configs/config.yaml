model:
  text2midi_model:
    decoder_max_sequence_length: 2048
    decoder_num_layers: 18
    decoder_num_heads: 8
    decoder_d_model: 768
    decoder_intermediate_size: 1024
    use_moe: False
    num_experts: 4
    use_deepspeed: False
    use_accelerate: True
  

training:
  text2midi_model:
    epochs: 140
    batch_size: 1
    learning_rate: 0.000001
    weight_decay: 0.01
    gradient_accumulation_steps: 4
    with_tracking: False  # Set to True if using wandb
    checkpointing_steps: epoch
    report_to: wandb
    output_dir: ./output  # Changed to relative path
    per_device_train_batch_size: 32
    use_scheduler: True
    lr_scheduler_type: cosine #choices=["linear", "cosine", "cosine_with_restarts", "polynomial", "constant", "constant_with_warmup"]
    num_warmup_steps: 100
    save_every: 5
    max_train_steps: None
    scheduled_sampling: False
    epsilon: 0
    c: -0.0161
    k: -0.312

raw_data:
  caption_dataset_path: ./captions/captions.json  # Changed to relative path
  raw_data_folders: 
    lmd: 
      folder_path: ./data/lakhmidi  # Changed to relative path (optional, only if you have this data)
      file_extension: midi
    symphonynet:
      folder_path: ./data/symphonynet  # Changed to relative path
      file_extension: mid
    maestro:
      folder_path: ./data/maestro-v3.0.0  # Changed to relative path
      file_extension: midi
    pop909:
      folder_path: ./data/POP909  # Changed to relative path
      file_extension: mid
    pijama:
      folder_path: ./data/PiJAMA  # Changed to relative path
      file_extension: midi
    midicaps:
      folder_path: ./data/midicaps  # Changed to relative path
      file_extension: mid
    

deepspeed_config:
  deepspeed_config_path: ./configs/ds_config.json  # Changed to relative path

artifact_folder: ./artifacts